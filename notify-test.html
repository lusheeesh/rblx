<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notify test</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --border:  #30363d;
  --blue:    #58a6ff;
  --green:   #3fb950;
  --red:     #f85149;
  --gold:    #d29922;
  --purple:  #bc8cff;
  --text:    #c9d1d9;
  --text2:   #8b949e;
  --mono:    'Share Tech Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* scanline overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 100;
}

.panel {
  width: 100%;
  max-width: 500px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

/* title bar like a terminal */
.titlebar {
  background: #21262d;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot { width: 11px; height: 11px; border-radius: 50%; }
.dot-r { background: #f85149; }
.dot-y { background: #d29922; }
.dot-g { background: #3fb950; }
.titlebar-name {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text2);
  margin-left: 6px;
  letter-spacing: 0.05em;
}

.body {
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* endpoint label */
.endpoint {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--text2);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.endpoint::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* buttons */
.btn {
  width: 100%;
  padding: 2px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
  position: relative;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; transform: none; }

.btn-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 16px;
  border-radius: 3px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 0.88rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #fff;
}

.btn-blue   { background: linear-gradient(135deg, #1f6feb, #388bfd); }
.btn-blue .btn-inner   { background: transparent; }

.btn-green  { background: linear-gradient(135deg, #238636, #2ea043); }
.btn-green .btn-inner  { background: transparent; }

.btn-red    { background: linear-gradient(135deg, #b91c1c, #ef4444); }
.btn-red .btn-inner    { background: transparent; }

.btn-gold   { background: linear-gradient(135deg, #92400e, #d97706); }
.btn-gold .btn-inner   { background: transparent; }

.btn-purple { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
.btn-purple .btn-inner { background: transparent; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
}
.btn-ghost .btn-inner { color: var(--text2); font-size: 0.75rem; }
.btn-ghost:hover .btn-inner { color: var(--text); }

/* icon inside button */
.btn-icon { font-size: 1rem; line-height: 1; }

/* divider */
.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 4px 0;
}

/* log output */
.log {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--text2);
  min-height: 80px;
  max-height: 180px;
  overflow-y: auto;
  line-height: 1.8;
  margin-top: 4px;
}
.log::-webkit-scrollbar { width: 4px; }
.log::-webkit-scrollbar-track { background: transparent; }
.log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-line { display: flex; gap: 8px; }
.log-time { color: #444d56; flex-shrink: 0; }
.log-ok   { color: var(--green); }
.log-err  { color: var(--red); }
.log-info { color: var(--blue); }
.log-warn { color: var(--gold); }
.log-idle { color: #444d56; font-style: italic; }

.section-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: #444d56;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 6px;
}
</style>
</head>
<body>

<div class="panel">
  <div class="titlebar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span class="titlebar-name">POST /api/notify — test harness</span>
  </div>

  <div class="body">
    <div class="endpoint">https://vaultsteam.vercel.app/api/notify</div>

    <!-- Main webhook tests -->
    <div class="section-label">→ main webhook (DISCORD_WEBHOOK)</div>

    <button class="btn btn-blue" onclick="send('vault_open')">
      <div class="btn-inner"><span class="btn-icon">👁️</span> Vault Opened</div>
    </button>

    <button class="btn btn-gold" onclick="send('ad_click')">
      <div class="btn-inner"><span class="btn-icon">🔗</span> Ad Click</div>
    </button>

    <button class="btn btn-green" onclick="send('session_end')">
      <div class="btn-inner"><span class="btn-icon">📹</span> Session Ended</div>
    </button>

    <hr class="divider">

    <!-- Stats webhook -->
    <div class="section-label">→ stats webhook (DISCORD_STATS_WEBHOOK)</div>

    <button class="btn btn-purple" onclick="send('unlock')">
      <div class="btn-inner"><span class="btn-icon">🔓</span> Vault Unlocked (stats)</div>
    </button>

    <button class="btn btn-purple" onclick="send('idle')">
      <div class="btn-inner"><span class="btn-icon">💤</span> User Went Idle (stats)</div>
    </button>

    <hr class="divider">

    <!-- Suggestions webhook -->
    <div class="section-label">→ suggestions webhook (DISCORD_SUGGESTIONS_WEBHOOK)</div>

    <button class="btn btn-red" onclick="send('suggestion')">
      <div class="btn-inner"><span class="btn-icon">💡</span> Send Suggestion</div>
    </button>

    <hr class="divider">

    <!-- Misc -->
    <button class="btn btn-ghost" onclick="clearLog()">
      <div class="btn-inner">clear log</div>
    </button>

    <!-- Log -->
    <div class="log" id="log">
      <div class="log-line"><span class="log-idle">— ready. hit a button to fire a test request —</span></div>
    </div>
  </div>
</div>

<script>
// ── Change this if you're testing on a different origin ──
var BASE = '';   // empty = same origin (works on Vercel)

var PAYLOADS = {
  vault_open: {
    stats: false,
    payload: {
      embeds: [{
        title: '👁️ Vault Opened [TEST]',
        color: 0xc8a951,
        fields: [
          { name: 'User',   value: '`u_TEST01`',   inline: true },
          { name: 'Vault',  value: 'Test Account',  inline: true },
          { name: 'Device', value: '🖥️ Desktop',    inline: true }
        ],
        footer: { text: 'notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  },

  ad_click: {
    stats: false,
    payload: {
      embeds: [{
        title: '🔗 Ad Click [TEST]',
        color: 0x66c0f4,
        fields: [
          { name: 'User',   value: '`u_TEST01`',  inline: true },
          { name: 'Vault',  value: 'Test Account', inline: true },
          { name: 'Method', value: 'work.ink',     inline: true },
          { name: 'Device', value: '🖥️ Desktop',   inline: true }
        ],
        footer: { text: 'notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  },

  session_end: {
    stats: false,
    payload: {
      embeds: [{
        title: '📹 Session Ended [TEST]',
        color: 0x5ba32b,
        fields: [
          { name: 'User',          value: '`u_TEST01`', inline: true },
          { name: 'Device',        value: '🖥️ Desktop', inline: true },
          { name: 'Total time',    value: '4m 12s',     inline: true },
          { name: 'Time in vault', value: '2m 30s',     inline: true }
        ],
        footer: { text: 'notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  },

  unlock: {
    stats: true,
    payload: {
      embeds: [{
        title: '🔓 Vault Unlocked [TEST]',
        color: 0x5ba32b,
        fields: [
          { name: 'User',   value: '`u_TEST01`',  inline: true },
          { name: 'Device', value: '🖥️ Desktop',  inline: true },
          { name: 'Screen', value: '1920x1080',   inline: true }
        ],
        footer: { text: 'Steam Vault Stats — notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  },

  idle: {
    stats: true,
    payload: {
      embeds: [{
        title: '💤 User Went Idle [TEST]',
        color: 0x556677,
        fields: [
          { name: 'User',       value: '`u_TEST01`', inline: true },
          { name: 'Device',     value: '🖥️ Desktop', inline: true },
          { name: 'Idle after', value: '3 min',      inline: true }
        ],
        footer: { text: 'Steam Vault Stats — notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  },

  suggestion: {
    suggestions: true,
    payload: {
      embeds: [{
        title: '💡 Suggestion [TEST]',
        color: 0x66c0f4,
        description: 'This is a test suggestion from notify-test.html',
        fields: [
          { name: 'User',   value: '`u_TEST01`', inline: true },
          { name: 'Device', value: '🖥️ Desktop', inline: true }
        ],
        footer: { text: 'Steam Vault Feedback — notify-test.html' },
        timestamp: new Date().toISOString()
      }]
    }
  }
};

function now() {
  return new Date().toLocaleTimeString('en-US', { hour12: false });
}

function log(msg, type) {
  var el = document.getElementById('log');
  var line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = '<span class="log-time">' + now() + '</span><span class="log-' + (type||'info') + '">' + msg + '</span>';
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

async function send(key) {
  var body = PAYLOADS[key];
  if (!body) return;

  var webhook = body.suggestions ? 'DISCORD_SUGGESTIONS_WEBHOOK'
              : body.stats       ? 'DISCORD_STATS_WEBHOOK'
              :                    'DISCORD_WEBHOOK';

  log('→ POST /api/notify  [' + key + ']  routing to: ' + webhook, 'info');

  // disable all buttons while in flight
  var btns = document.querySelectorAll('.btn:not(.btn-ghost)');
  btns.forEach(function(b){ b.disabled = true; });

  try {
    var res = await fetch(BASE + '/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      log('✓ ' + res.status + ' OK — Discord received it', 'ok');
    } else if (res.status === 204) {
      log('⚠ 204 — no webhook configured for ' + webhook + ' in env vars', 'warn');
    } else if (res.status === 502) {
      log('✗ 502 — Discord rejected the payload (check embed format)', 'err');
    } else {
      log('✗ ' + res.status + ' — unexpected response', 'err');
    }
  } catch (e) {
    log('✗ fetch failed — is the dev server running? (' + e.message + ')', 'err');
  } finally {
    btns.forEach(function(b){ b.disabled = false; });
  }
}
</script>

</body>
</html>
